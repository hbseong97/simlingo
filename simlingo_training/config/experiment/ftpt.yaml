# @package _global_
defaults:
  - /data_module: carla_no_buckets #carla_no_buckets #carla_bucket_v12
  - /model/vision_model: vlm 
  - /data_module/base_dataset: dataset

model:
  lr: 3e-5
  predict_route_as_wps: True
  speed_wps_mode: 2d
  language_model:
    # variant: '/mnt/harbor/projects/owa/checkpoints/InternVL3-1B-hf-no_seminit'
    # variant: '/mnt/harbor/users/jyjung/checkpoints/iclr_agent/InternVL3-1B-HF_0ms/checkpoint-12892'
    variant: '/mnt/harbor/users/jyjung/checkpoints/iclr_agent/InternVL3-1B-HF_0ms-PT-FT/checkpoint-9669'
    lora: True
    lora_alpha: 64
    lora_r: 32
    lora_dropout: 0.1
  vision_model:
    # variant: '/mnt/harbor/projects/owa/checkpoints/InternVL3-1B-hf-no_seminit'
    # variant: '/mnt/harbor/users/jyjung/checkpoints/iclr_agent/InternVL3-1B-HF_0ms/checkpoint-12892'
    variant: '/mnt/harbor/users/jyjung/checkpoints/iclr_agent/InternVL3-1B-HF_0ms-PT-FT/checkpoint-9669'

data_module:
  batch_size: 8
  num_workers: 8
  # dreamer_dataset: null
  base_dataset:
    data_path: database/simlingo
    bucket_path: database/bucketsv2_simlingo
    pred_len: 11
    cut_bottom_quarter: True
    use_commentary: True
    use_qa: True
    qa_augmentation: True
    img_shift_augmentation: True
    img_shift_augmentation_prob: 0.5
    hist_len: 1
    route_as: target_point_command
    use_lmdrive_commands: True
    use_old_towns: True
    use_town13: True

    use_safety_flag: True

max_epochs: 1
# val_every_n_epochs: 1
val_check_interval: 500
limit_train_batches: 5000  # Limit to 3 batches per epoch (3 * 8 = 24 samples, close to 20)
limit_val_batches: 1  # Limit to 3 batches per validation (3 * 8 = 24 samples, close to 20)

gpus: 8
seed: 42
name: debug